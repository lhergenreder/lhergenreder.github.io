- name: "Homogeneous Isotropic Turbulence Chamber"
  subtitle: "Propeller-driven HIT chamber for Newtonian and non-Newtonian fluids"
  description: "An experimental device employing 12 center-pointing propellers placed a the vertices of an incosahedral chamber to approximate a spherical forcing for the generation of homogeneous and isotropic turbulence."
