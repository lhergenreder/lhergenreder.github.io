- name: "Vortex Ring Generation System"
  subtitle: "Vortex ring interaction with background turbulence"
  description: "An experimental setup for generating vortex rings into homogeneous isotropic turbulence. The system integrates a pistor driven by a linear actuator with stereoscopic PIV to build a comprehensive database for the implementation of data-driven analysis. Linear actuator, PIV system and HIT chamber forcing are synchronized to be able to perform ensemble averaging across experimental realizations."
